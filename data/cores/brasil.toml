# Cores dos clubes: tema, camisa e padrao.
#
# Ficam FORA do pack porque o pack e gerado pelo importador -- editar as cores la
# sumiria na proxima importacao. O importador le este arquivo e grava no pack, do
# mesmo jeito que data/ajustes/ corrige overall. Depois de editar aqui, rode
# `python -m fm.cli cores` para reaplicar nos packs ja gerados, sem rede.
#
# TEMA (`primaria`/`secundaria`) e a cor de identidade do clube: e o que pinta a
# interface. Pintar o Corinthians de verde porque verde e a cor do jogo e pior que
# nao pintar nada: verde e a cor do rival.
#
# CAMISA (`camisa` = [pano, detalhe]) e outra coisa, e so aparece quando difere do
# tema. O Corinthians tem tema preto e uniforme branco; o Sao Paulo, tema vermelho e
# uniforme branco com faixas. Usar a cor-tema como pano vestia metade da Serie A com
# o uniforme errado.
#
# PADRAO: liso, listras (verticais), aros (horizontais estreitos), faixa (uma faixa
# no peito) ou diagonal. Sem `padrao`, liso.
#
# Confianca: os vinte da Serie A foram escritos com o uniforme 1 em mente e sao os
# que eu conheco. Na Serie B varios ficaram `liso` porque nao sei o padrao -- liso
# com a cor certa erra menos que listras inventadas.

# A que packs este arquivo se aplica. Nome de clube colide entre paises: "Athletic Club"
# e o Bilbao na Espanha e o de Sao Joao del-Rei aqui. Sem esta linha o Bilbao saiu de
# preto e amarelo.
packs = ["brasil_serie_a", "brasil_serie_b", "brasil"]

fonte = "cores e padroes conhecidos dos clubes; conferir antes de tratar como oficial"
verificado = false

