# Cores dos clubes: primaria e secundaria, em hexadecimal.
#
# Ficam FORA do pack porque o pack e gerado pelo importador -- editar as cores la
# sumiria na proxima importacao. O importador le este arquivo e grava as cores no
# pack, do mesmo jeito que data/ajustes/ corrige overall.
#
# Sao as cores que a interface usa como tema do clube. Pintar o Corinthians de verde
# porque verde e a cor do jogo e pior que nao pintar nada: verde e a cor do rival.

