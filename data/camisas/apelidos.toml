# Como cada clube esta escrito no nome de arquivo da Wikimedia Commons.
#
# O nome do arquivo e `Kit_body_<apelido><temporada><h|a>.png`. Na maioria o apelido e o
# nome do clube sem espaco e sem acento, e nesse caso nao precisa entrar aqui -- o
# importador acerta sozinho. Esta lista e para quem nao segue essa regra.
#
# ADIVINHAR o apelido a partir de pedacos do nome foi tentado e e PERIGOSO: "Vasco da
# Gama" casava com `gama`, que e o Gama-DF, e "Gremio Novorizontino" casaria com `gremio`,
# que e o de Porto Alegre. Vestir o clube com a camisa de outro nao levanta erro nenhum --
# so aparece na tela, depois. Por isso o importador so tenta o nome inteiro e, fora isso,
# exige uma linha aqui.
#
# Cada apelido abaixo foi conferido baixando a camisa e OLHANDO: `inter` e vermelha lisa
# (Internacional; a Inter de Milao e listrada azul e preta), `coxa` e branca e verde
# (Coritiba) e `cap` e preta e vermelha na diagonal (Athletico Paranaense).

fonte = "Wikimedia Commons; cada apelido conferido visualmente na camisa baixada"
verificado = true

[clubes]
"Sao Paulo" = "spfc"
"Vasco da Gama" = "vasco"
"Atletico Mineiro" = "atleticomg"
"Athletico Paranaense" = "cap"
"Coritiba" = "coxa"
"Internacional" = "inter"

# Espanha e Serie B (25/09/2026). Os ambiguos -- sport, depor, gijon -- foram conferidos
# na camisa baixada antes de entrar aqui. `racing` NAO: e o Racing da Argentina (listras
# celeste e branco); o Racing Santander joga de branco e verde e fica sem camisa importada.
"Real Betis" = "betis"
"Athletic Club" = "bilbao"
"Deportivo A Coruña" = "depor"
"Rayo Vallecano" = "rayo"
"Real Sporting de Gijón" = "gijon"
"Real Valladolid" = "valladolid"
"Albacete Balompié" = "albacete"
"CE Sabadell" = "sabadell"
"Sport Recife" = "sport"
"Atlético Goianiense" = "atleticogo"
"América Mineiro" = "americamg"
"AA Ponte Preta" = "pontepreta"
# time B joga com a camisa do principal
"Real Sociedad SS B (Sanse)" = "realsociedad"
"Celta Fortuna" = "celta"

# Sem camisa recente na Commons (25/09/2026): Novorizontino (a ultima e de 2019) e
# Athletic Club (MG, nenhuma). Ficam com a camisa desenhada nas cores.
#
# Pendente: "Red Bull Bragantino". O prefixo `bragantino` so tem arquivos ate 2019, antes
# de o clube virar Red Bull, e `rbbragantino` tem dois. Fica sem camisa importada ate
# alguem conferir qual e o certo -- melhor sem do que com a do clube errado.
