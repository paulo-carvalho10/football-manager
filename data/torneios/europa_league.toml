vagas = 3
entra_em = "liga"
[[classificacao]]
fonte = "PO1"
vagas = 2
entra_em = "liga"
[[classificacao]]
fonte = "NL1"
vagas = 2
entra_em = "liga"
[[classificacao]]
fonte = "BE1"
vagas = 2
entra_em = "liga"
[[classificacao]]
