# ---- 8 vindas do funil: quem perdeu a pre da Champions
[[classificacao]]
fonte = "champions:eliminados_pre"
vagas = 8
entra_em = "liga"

[[formato.fases]]
nome        = "Fase de liga"
tipo        = "liga_suica"
adversarios = 8
potes       = 4
avancam     = 24
entram      = [ { classificacao = "liga" } ]

[[formato.fases]]
nome    = "Playoff"
tipo    = "knockout"
maos    = 2
rodadas = 1
isentos = 8

[[formato.fases]]
nome     = "Mata-mata"
tipo     = "knockout"
maos     = 2
penaltis = true
