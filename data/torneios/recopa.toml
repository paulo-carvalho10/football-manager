# Recopa Sul-Americana: o campeao da Libertadores contra o da Sul-Americana, em ida e volta,
# no comeco do ano. No primeiro ano da carreira ainda nao ha campeoes, e as vagas vao aos
# mais fortes da Conmebol.
id   = "recopa"
nome = "Recopa Sul-Americana"

[estilo]
gols_base = 1.16
mando     = 0.42

[mentalidade]
gols_mult  = 0.90
compressao = 0.18

[[classificacao]]
fonte    = "libertadores"
reservas = ["CONMEBOL"]
vagas    = 1
entra_em = "final"

[[classificacao]]
fonte    = "sudamericana"
reservas = ["CONMEBOL"]
vagas    = 1
entra_em = "final"

[[formato.fases]]
nome    = "Final"
janela  = ["02-17", "02-26"]   # dias reais da fase (fm.agenda)
tipo    = "knockout"
maos    = 2
rodadas = 1
entram  = [ { classificacao = "final" } ]
