[[formato.fases]]
nome    = "Pré-eliminatória"
janela  = ["04-21", "04-29"]   # dias reais da fase (fm.agenda)
tipo    = "knockout"
maos    = 2
rodadas = 1
entram  = [ { classificacao = "pre" } ]
# Unico funil europeu que ainda existe: quem perde a QUALIFICACAO da Champions vai para a
# Europa League. Da fase de liga nao cai mais ninguem -- do 25o ao 36o todos estao
# eliminados desde 2024-25, quando os grupos acabaram.
exporta = [ { eliminados = true, para = "eliminados_pre" } ]

# ATENCAO: a fase de liga NAO exporta ninguem. Antes de 2024-25 o 3o de cada grupo caia
# para a Europa League; com o fim dos grupos isso acabou.
[[formato.fases]]
nome        = "Fase de liga"
janela  = ["05-05", "09-08"]   # dias reais da fase (fm.agenda)
tipo        = "liga_suica"
adversarios = 8
potes       = 4
avancam     = 24     # do 25o ao 36o estao fora
entram      = [ { classificacao = "liga" } ]

[[formato.fases]]
nome    = "Playoff"
janela  = ["09-22", "09-30"]   # dias reais da fase (fm.agenda)
tipo    = "knockout"
maos    = 2
rodadas = 1
isentos = 8          # 1o ao 8o da fase de liga vao direto as oitavas

[[formato.fases]]
nome     = "Mata-mata"
janela  = ["10-13", "11-26"]   # dias reais da fase (fm.agenda)
chave    = "fixa"   # 1o ao 8o da fase de liga x vencedores do playoff
tipo     = "knockout"
maos     = 2
rodadas  = 3         # oitavas, quartas e semifinal
penaltis = true

[[formato.fases]]
nome     = "Final"
janela  = ["12-09", "12-09"]   # dias reais da fase (fm.agenda)
tipo     = "knockout"
maos     = 1         # jogo unico, como na vida real
rodadas  = 1
penaltis = true
