# Liga dos Campeoes no formato ATUAL, que vale desde 2024-25.
#
# O que mudou e por que isto foi reescrito: o formato antigo (8 grupos de 4) acabou. Hoje
# sao 36 clubes numa TABELA UNICA, cada um jogando 8 partidas contra 8 adversarios
# diferentes, 4 em casa e 4 fora -- nao joga contra todos. Do 1o ao 8o vao direto as
# oitavas; do 9o ao 24o disputam um playoff eliminatorio; do 25o ao 36o estao fora.
#
# PRE CURTA: a Champions real tem duas trilhas de qualificacao (Campeoes e Liga) com quatro
# rodadas cada, alimentadas por ligas que nao importamos. Aqui a pre e uma rodada so, com
# os clubes das ligas que EXISTEM no jogo: 16 entram, 8 passam e completam os 36.
#
# Conta das 36 vagas:  28 diretas + 8 vindas da pre.
id   = "champions"
nome = "Liga dos Campeões"

[estilo]
gols_base = 1.31   # nivel altissimo dos dois lados: jogo mais aberto que liga nacional
mando     = 0.24   # elenco grande viaja bem, o mando pesa menos

[mentalidade]
gols_mult  = 0.94
compressao = 0.12

# ---- 28 vagas diretas para a fase de liga, em ordem de prioridade
[[classificacao]]
fonte = "GB1"
vagas = 4
entra_em = "liga"
[[classificacao]]
fonte = "ES1"
vagas = 4
entra_em = "liga"
[[classificacao]]
fonte = "IT1"
vagas = 4
entra_em = "liga"
[[classificacao]]
fonte = "L1"
vagas = 4
entra_em = "liga"
[[classificacao]]
fonte = "FR1"
vagas = 4
entra_em = "liga"
[[classificacao]]
fonte = "PO1"
vagas = 2
entra_em = "liga"
[[classificacao]]
fonte = "NL1"
vagas = 2
entra_em = "liga"
[[classificacao]]
fonte = "BE1"
vagas = 1
entra_em = "liga"
[[classificacao]]
fonte = "TR1"
vagas = 1
entra_em = "liga"
[[classificacao]]
fonte = "GR1"
vagas = 1
entra_em = "liga"
[[classificacao]]
fonte = "UKR1"
vagas = 1
entra_em = "liga"

# ---- 16 na pre curta: o clube seguinte de cada liga ja representada, mais o campeao das
