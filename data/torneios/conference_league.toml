# Conference League, a terceira copa da UEFA, no formato atual: 36 clubes numa fase de liga
# de 6 jogos (contra 6 adversarios, 3 em casa e 3 fora); do 1o ao 8o direto as oitavas, do
# 9o ao 24o um playoff, o resto esta fora. Mata-mata em chave fixa e final em jogo unico.
#
# As vagas sao as seguintes de cada pais, depois da Champions e da Liga Europa: a cascata
# pula quem ja se classificou para uma delas. NAO CONFERIDO: a divisao por liga e estimativa.
id   = "conference_league"
nome = "Conference League"

[estilo]
gols_base = 1.27
mando     = 0.30

[mentalidade]
gols_mult  = 0.93
compressao = 0.15

