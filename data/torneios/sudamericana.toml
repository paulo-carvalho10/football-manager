# Copa Sul-Americana no formato atual.
#
#   Primeira fase   32 clubes de 8 paises (4 de cada, menos Brasil e Argentina), jogo
#                   unico -> 16 passam. Na vida real os confrontos sao entre clubes do
#                   mesmo pais; aqui o sorteio e livre.
#   Fase de grupos  os 16 + 6 do Brasil + 6 da Argentina + 4 que cairam na terceira fase
#                   da Libertadores = 32, 8 grupos de 4. O 1o vai direto as oitavas; o 2o
#                   joga o playoff contra um 3o colocado dos grupos da Libertadores.
#   Playoff         8 segundos + 8 terceiros da Libertadores, ida e volta
#   Oitavas, quartas e semifinal em ida e volta; FINAL EM JOGO UNICO
#
# Vagas reconstituidas do regulamento de 2025-26 (confira antes de tratar como fonte
# oficial). Quem ja pegou vaga na Libertadores nao entra (a cascata e compartilhada).
id   = "sudamericana"
nome = "Copa Sul-Americana"
# datas a mais na agenda: a fase de grupos espera a terceira fase da Libertadores e o
# playoff espera os grupos dela. Data de espera e pulada, mas tem de existir.
folga_de_datas = 6

[estilo]
gols_base = 1.14   # nivel mais baixo que a Libertadores e jogo ainda mais truncado
mando     = 0.44   # e o mando pesa mais ainda: campos piores e viagens piores

[mentalidade]
gols_mult  = 0.90
compressao = 0.20

# ------------------------------------------------------------ direto nos grupos
[[classificacao]]
fonte    = "BRA1"
vagas    = 6
entra_em = "grupos"
[[classificacao]]
fonte    = "ARG1"
vagas    = 6
entra_em = "grupos"
[[classificacao]]
fonte    = "libertadores:eliminados_pre"   # chegam quando a terceira fase acaba
vagas    = 4
entra_em = "grupos"

# ------------------------------------------------------------ primeira fase (32)
[[classificacao]]
fonte    = "COLP"
vagas    = 4
entra_em = "primeira"
[[classificacao]]
fonte    = "CLPD"
vagas    = 4
entra_em = "primeira"
[[classificacao]]
fonte    = "URU1"
vagas    = 4
entra_em = "primeira"
[[classificacao]]
fonte    = "EC1N"
vagas    = 4
entra_em = "primeira"
[[classificacao]]
fonte    = "PR1A"
vagas    = 4
entra_em = "primeira"
[[classificacao]]
fonte    = "TDeA"
vagas    = 4
entra_em = "primeira"
[[classificacao]]
fonte    = "BO1A"
vagas    = 4
entra_em = "primeira"
[[classificacao]]
fonte    = "VZ1A"
vagas    = 4
entra_em = "primeira"

# ------------------------------------------------------------ playoff
[[classificacao]]
fonte    = "sudamericana:segundos"        # os 2os dos grupos desta copa
vagas    = 8
entra_em = "playoff"
[[classificacao]]
fonte    = "libertadores:terceiros"       # os 3os dos grupos da Libertadores
vagas    = 8
entra_em = "playoff"

# ------------------------------------------------------------ formato
[[formato.fases]]
nome    = "Primeira fase"
janela  = ["03-03", "03-06"]   # dias reais da fase (fm.agenda)
tipo    = "knockout"
maos    = 1
rodadas = 1
entram  = [ { classificacao = "primeira" } ]

[[formato.fases]]
nome    = "Fase de grupos"
janela  = ["04-02", "05-29"]   # dias reais da fase (fm.agenda)
potes   = 4
tipo    = "groups"
grupos  = 8
voltas  = 2
avancam = 1          # o 1o vai direto as oitavas
entram  = [ { classificacao = "grupos" } ]
aguarda = "libertadores:eliminados_pre"
exporta = [ { posicao = 2, para = "segundos" } ]

[[formato.fases]]
nome    = "Playoff"
janela  = ["07-15", "07-23"]   # dias reais da fase (fm.agenda)
tipo    = "knockout"
maos    = 2
rodadas = 1
isentos = 8          # os 8 primeiros colocados esperam nas oitavas
entram  = [ { classificacao = "playoff" } ]
aguarda = "libertadores:terceiros"

[[formato.fases]]
nome     = "Mata-mata"
janela  = ["08-13", "10-30"]   # dias reais da fase (fm.agenda)
chave    = "fixa"   # 1o de grupo x vencedor do playoff, caminho decidido ate a final
tipo     = "knockout"
maos     = 2
rodadas  = 3         # oitavas, quartas e semifinal
penaltis = true

[[formato.fases]]
nome     = "Final"
janela  = ["11-21", "11-21"]   # dias reais da fase (fm.agenda)
tipo     = "knockout"
maos     = 1
rodadas  = 1
penaltis = true
