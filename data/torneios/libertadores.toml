# Copa Libertadores. Mesmo desenho da Champions: vagas por liga, campo fixo.
id   = "libertadores"
nome = "Copa Libertadores"

[estilo]
gols_base = 1.16    # sul-americana e mais truncada que a europeia
mando     = 0.42    # e o mando pesa MUITO mais: altitude, gramado, viagem e caldeirao

[mentalidade]
gols_mult  = 0.90
compressao = 0.18

[formato]
fases = [
  { tipo = "groups",   grupos = 8, voltas = 2, avancam = 2 },
  { tipo = "knockout", maos = 2, penaltis = true },
]

# 28 vagas por CLASSIFICACAO das ligas importadas.
# A Serie B nao da vaga na Libertadores (quem da e a Copa do Brasil, que ainda nao existe
# aqui); as vagas do Brasil ficam todas na Serie A.
[vagas]
BRA1 = 8
ARG1 = 6
URU1 = 3
COLP = 3
CLPD = 3
EC1N = 3
PR1A = 2

# 4 vagas FIXAS: Bolivia e Venezuela nao tem liga importada, entao nao ha tabela de onde
# classificar. Estes clubes entram direto, com forca declarada aqui. E o unico caso em que
# participante e fixo -- todo o resto sai da classificacao.
[[convidados]]
nome  = "Bolivar"
pais  = "BOL"
forca = 62

[[convidados]]
nome  = "The Strongest"
pais  = "BOL"
forca = 60

[[convidados]]
nome  = "Deportivo Tachira"
pais  = "VEN"
forca = 59

[[convidados]]
nome  = "Carabobo"
pais  = "VEN"
forca = 58
