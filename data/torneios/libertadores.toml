# ------------------------------------------------------------ formato
[[formato.fases]]
nome    = "Primeira fase"
tipo    = "knockout"
maos    = 2
rodadas = 1
entram  = [ { classificacao = "primeira" } ]

[[formato.fases]]
nome    = "Segunda fase"
tipo    = "knockout"
maos    = 2
rodadas = 1
entram  = [ { classificacao = "segunda" } ]

[[formato.fases]]
nome    = "Terceira fase"
tipo    = "knockout"
maos    = 2
rodadas = 1
# quem cai na terceira fase nao fica sem competicao: vai para a Sul-Americana
exporta = [ { eliminados = true, para = "eliminados_pre" } ]

[[formato.fases]]
nome    = "Fase de grupos"
tipo    = "groups"
grupos  = 8
voltas  = 2
avancam = 2
entram  = [ { classificacao = "grupos" } ]
# o 3o de cada grupo cai para o playoff da Sul-Americana
exporta = [ { posicao = 3, para = "terceiros" } ]

[[formato.fases]]
nome     = "Mata-mata"
tipo     = "knockout"
maos     = 2
rodadas  = 3          # oitavas, quartas e semifinal
penaltis = true

[[formato.fases]]
nome     = "Final"
tipo     = "knockout"
maos     = 1          # jogo unico, como desde 2019
rodadas  = 1
penaltis = true
