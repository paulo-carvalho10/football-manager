# Copa Libertadores no formato atual: 47 clubes de 10 paises.
#
#   Primeira fase   6 clubes, ida e volta           -> 3 passam
#   Segunda fase    13 entram + os 3               -> 16, ida e volta -> 8 passam
#   Terceira fase   8 clubes, ida e volta           -> 4 passam; quem cai vai para a
#                                                     fase de grupos da Sul-Americana
#   Fase de grupos  28 diretos + os 4 = 32, 8 grupos de 4; passam 2, o 3o cai para a
#                   Sul-Americana
#   Oitavas, quartas e semifinal em ida e volta; FINAL EM JOGO UNICO
#
# Vagas por pais (reconstituidas do regulamento de 2025-26; confira antes de tratar como
# fonte oficial):
#   Brasil 7:     campeao da Copa do Brasil + 1o ao 4o do Brasileirao nos grupos;
#                 5o e 6o na segunda fase
#   Argentina 6:  1o ao 5o nos grupos; 6o na segunda fase
#   Colombia, Chile: 2 nos grupos, 2 na segunda fase
#   Uruguai, Equador, Paraguai, Peru, Bolivia, Venezuela: 2 nos grupos, 1 na segunda
#                 fase, 1 na primeira fase
#   + o campeao da Libertadores e o da Sul-Americana do ano anterior, nos grupos
#
# A CASCATA sai da ordem das regras: cada uma leva os N primeiros da fonte que AINDA NAO
# se classificaram. Se o campeao da Copa do Brasil e o 2o do Brasileirao, a regra do
# Brasileirao pula ele e a vaga desce -- como na vida real.
#
# Os campeonatos de fora do pais da carreira nao sao jogados rodada a rodada: a carreira
# simula a temporada deles na virada do ano (fm.carreira), e a tabela simulada classifica.
id   = "libertadores"
nome = "Copa Libertadores"

[estilo]
gols_base = 1.16
mando     = 0.42   # altitude, gramado, viagem e caldeirao pesam muito mais aqui

[mentalidade]
gols_mult  = 0.90
compressao = 0.18

# ------------------------------------------------------------ fase de grupos (28 diretos)
# os campeoes do ano anterior primeiro: se ja estiverem classificados pela liga, a cascata
# leva a vaga da liga para o proximo. No primeiro ano da carreira ainda nao ha campeao, e
# a vaga vai para o mais forte do continente que sobrar (reserva "CONMEBOL").
[[classificacao]]
fonte    = "libertadores"
reservas = ["CONMEBOL"]
vagas    = 1
entra_em = "grupos"

[[classificacao]]
fonte    = "sudamericana"
reservas = ["CONMEBOL"]
vagas    = 1
entra_em = "grupos"

[[classificacao]]
fonte    = "copa_do_brasil"   # ordem da fonte: campeao, vice
reservas = ["BRA1"]           # no 1o ano ainda nao ha campeao: a vaga desce na tabela
vagas    = 1
entra_em = "grupos"

[[classificacao]]
fonte    = "BRA1"
vagas    = 4
entra_em = "grupos"

[[classificacao]]
fonte    = "ARG1"
vagas    = 5
entra_em = "grupos"

[[classificacao]]
fonte    = "COLP"
vagas    = 2
entra_em = "grupos"
[[classificacao]]
fonte    = "CLPD"
vagas    = 2
entra_em = "grupos"
[[classificacao]]
fonte    = "URU1"
vagas    = 2
entra_em = "grupos"
[[classificacao]]
fonte    = "EC1N"
vagas    = 2
entra_em = "grupos"
[[classificacao]]
fonte    = "PR1A"
vagas    = 2
entra_em = "grupos"
[[classificacao]]
fonte    = "TDeA"
vagas    = 2
entra_em = "grupos"
[[classificacao]]
fonte    = "BO1A"
vagas    = 2
entra_em = "grupos"
[[classificacao]]
fonte    = "VZ1A"
vagas    = 2
entra_em = "grupos"

# ------------------------------------------------------------ segunda fase (13)
[[classificacao]]
fonte    = "BRA1"
vagas    = 2
entra_em = "segunda"
[[classificacao]]
