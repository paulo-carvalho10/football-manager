# Premier League (ENG), clubes e jogadores reais. Criada em 28/09/2026 para a versao completa.
# Liga mais aberta das grandes e mando fraco: jogo de ida e volta.
id     = "eng_1_real"
nome   = "Premier League"
pais   = "ENG"
tier   = 1
codigo = "GB1"   # competicao na fonte
clubes = 20

pack        = "inglaterra_premier"
pack_offset = 0

[estilo]
gols_base = 1.38
mando     = 0.24

[formato]
fases  = [ { tipo = "round_robin", voltas = 2 } ]
acesso = { sobem = 0, descem = 3 }

# Faixas escritas de memoria, ordem de grandeza -- como as da Serie B. Re-derivar com as
# tabelas reais antes de tratar como fonte.
# O campeao aqui soma um pouco menos que o real porque o espalhamento (beta) desta liga
# e limitado de proposito: com beta alto o topo passava do Real Madrid e distorcia a
# Champions. Comparacao ENTRE ligas vale mais que acertar o campeao na casa decimal.
[alvos]
zero_a_zero_pct           = [4.5, 8.5]
gols_por_jogo             = [2.75, 3.25]
empate_pct                = [19.0, 26.0]
vitoria_casa_pct          = [41.0, 48.0]
vitoria_fora_pct          = [29.0, 36.0]
margem_3_ou_mais_pct      = [14.0, 21.0]
margem_4_ou_mais_pct      = [5.0, 9.5]
cinco_ou_mais_gols_pct    = [12.0, 19.0]
pontos_do_campeao         = [76.0, 95.0]
pontos_do_lanterna        = [14.0, 30.0]
melhor_elenco_campeao_pct = [30.0, 75.0]

# O nivel desta liga em relacao as outras NAO esta aqui: ele sai de
# fm.ratings.forca_mundial, pelo valor de elenco de todas as competicoes importadas juntas.
