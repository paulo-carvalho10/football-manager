# Serie B (ITA), clubes e jogadores reais. Criada em 28/09/2026 para a versao completa.
# Segunda divisao italiana: a mais empatada das ligas importadas.
id     = "ita_2_real"
nome   = "Serie B"
pais   = "ITA"
tier   = 2
codigo = "IT2"   # competicao na fonte
clubes = 20

pack        = "italia_serie_b"
pack_offset = 0

[estilo]
gols_base = 1.08
mando     = 0.30

[formato]
fases  = [ { tipo = "round_robin", voltas = 2 } ]
acesso = { sobem = 3, descem = 0 }

# Faixas escritas de memoria, ordem de grandeza -- como as da Serie B. Re-derivar com as
# tabelas reais antes de tratar como fonte.
[alvos]
