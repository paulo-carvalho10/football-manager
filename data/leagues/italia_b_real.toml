gols_por_jogo             = [2.15, 2.60]
empate_pct                = [28.0, 36.0]
vitoria_casa_pct          = [39.0, 47.0]
vitoria_fora_pct          = [21.0, 29.0]
margem_3_ou_mais_pct      = [7.5, 13.0]
margem_4_ou_mais_pct      = [1.5, 5.0]
cinco_ou_mais_gols_pct    = [5.5, 11.0]
pontos_do_campeao         = [66.0, 82.0]
pontos_do_lanterna        = [22.0, 38.0]
melhor_elenco_campeao_pct = [12.0, 50.0]

# O nivel desta liga em relacao as outras NAO esta aqui: ele sai de
# fm.ratings.forca_mundial, pelo valor de elenco de todas as competicoes importadas juntas.
