[project]
name = "football-manager"
version = "0.1.0"
description = "Motor de simulacao de futebol: carreira local, calibrado contra distribuicoes reais"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# So o importador precisa disto. O MOTOR (fm/, exceto fm/importer/) depende apenas de
# numpy -- e uma regra de arquitetura, nao economia de disco: jogo nao baixa pagina.
importador = ["beautifulsoup4>=4.12", "lxml>=5.0", "pillow>=11.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff.lint.per-file-ignores]
"baixar_mundo.py" = ["E402"]  # sys.path.insert antes dos imports, de proposito
